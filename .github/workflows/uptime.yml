name: Downtime alarm
# SCHEDULE TURNED OFF 2026-11-26: GitHub only ran this every 6-10 hours, so it could not be trusted. The real downtime alarm is now
# a Cloudflare Worker that checks every minute. This file stays for manual test runs only.
# Alarm: Pushover emergency priority, repeating until acknowledged. See .github/scripts/uptime.py.
on:
  # schedule (turned off, see note above):
  #   - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_alarm:
        description: "Send a test alarm to the phone? (yes / no)"
        default: "no"
permissions:
  contents: write
concurrency:
  group: uptime
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Check the site
        env:
          SITES: https://scottbeckmanart.com/,https://www.scottbeckmanart.com/
          MUST_CONTAIN: Scott Michael Beckman
          HTTPS_READY: "yes"   # "no" only while waiting for GitHub to issue a certificate
          SITE_NAME: scottbeckmanart.com
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          TEST_ALARM: ${{ github.event.inputs.test_alarm }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python3 .github/scripts/uptime.py
