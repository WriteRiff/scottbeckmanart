<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Scott Beckman Art</title>
<style>body{margin:0;background:#13110f;color:#efe8dc;font:17px/1.6 system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;text-align:center;padding:16px}h1{font:400 2.6rem/1.1 Didot,"Bodoni 72",Georgia,serif;margin:0 0 .4em}a{color:#cfac74}</style>
</head>
<body>
<main>
  <h1>That page has moved</h1>
  <p>The site has a new look. Everything is still here.</p>
  <p><a id="home" href="/">Go to the home page</a></p>
</main>
<script>
  // Works both at the github.io preview address (/repo-name/) and on the real domain.
  var p = location.pathname.split("/").filter(Boolean);
  if (location.hostname.endsWith("github.io") && p.length) document.getElementById("home").href = "/" + p[0] + "/";
</script>
</body>
</html>
